services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketplace_test
      POSTGRES_PASSWORD: marketplace_test
      POSTGRES_DB: marketplace_test
    ports:
      - "55435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace_test -d marketplace_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data

  minio-test:
    profiles: ["module21"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: marketplace-e2e
      MINIO_ROOT_PASSWORD: marketplace-e2e-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    tmpfs:
      - /data
