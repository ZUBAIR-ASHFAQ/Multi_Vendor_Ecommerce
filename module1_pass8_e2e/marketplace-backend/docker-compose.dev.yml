services:
  postgres-dev:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketplace_dev
      POSTGRES_PASSWORD: marketplace_dev
      POSTGRES_DB: marketplace_dev
    ports:
      - "55435:5432"
    volumes:
      - marketplace_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace_dev -d marketplace_dev"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis-dev:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    volumes:
      - marketplace_redis_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio-dev:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: marketplace-dev
      MINIO_ROOT_PASSWORD: marketplace-dev-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5174,http://127.0.0.1:5174"
    ports:
      - "59010:9000"
      - "59011:9001"
    volumes:
      - marketplace_minio_dev:/data

volumes:
  marketplace_postgres_dev:
  marketplace_redis_dev:
  marketplace_minio_dev:
